name: Publish Test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - run: echo "check"

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "signing"
